apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-portal-deployment
  labels:
    app: placement-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: placement-portal
  template:
    metadata:
      labels:
        app: placement-portal
    spec:
      containers:
      - name: placement-portal
        image: kanish0011/placement-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: placement-portal-service
spec:
  type: NodePort
  selector:
    app: placement-portal
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30080
